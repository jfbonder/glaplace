[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glaplace"
version = "0.1.0"
description = "g-Laplacian solver for Young functions G (p-q, p log^a, exp, two-phase...): decomposition-coordination method with P1 finite elements on general 2D domains"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]
license = {text = "MIT"}
authors = [{name = "Adriana Aragón"}, {name = "Julián Fernández Bonder"}]

[project.optional-dependencies]
meshing = ["triangle", "meshio"]
symbolic = ["sympy"]
test = ["pytest", "triangle", "meshio", "sympy"]

[tool.setuptools]
packages = ["glaplace"]
